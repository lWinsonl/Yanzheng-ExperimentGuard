# 免费托管实例。模型配置由 Render 后台管理,不把本地密钥写入仓库。
services:
  - type: web
    name: yanzheng-experiment-guard-demo
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /tmp/yanzheng-data
      - key: STATIC_DIR
        value: /app/static
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
